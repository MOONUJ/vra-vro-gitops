# 템플릿 예시입니다. 생성된 저장소에서는 instance.yaml로 복사해 값을 변경합니다.
apiVersion: gitops.vcf.example/v1alpha2
kind: AutomationInstance

metadata:
  name: automation-dev

spec:
  environmentTag: example
  endpoint: https://automation.example.com
  organization: default
  verifySsl: true
  gitops:
    tag: example
    projects: [example-project]
  management:
    infrastructure: native
    deletionPolicy: require-explicit-approval
  orchestrator:
    package:
      name: com.example.vcf
      localPath: content/orchestrator/packages/com.example.vcf.package
