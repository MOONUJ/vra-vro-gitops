name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tooling/vcf/requirements.txt
      - run: python -m pip install -r tooling/vcf/requirements.txt
      - run: python -m py_compile tooling/vcf/*.py tooling/template/*.py
      - run: python -m unittest discover -s tests
      - run: python tooling/vcf/schema_validation.py
      - run: python tooling/vcf/configure.py validate --instance instance.example.yaml --secrets secrets.example.json
      - run: python tooling/vcf/cli.py --infrastructure-root infrastructure validate
      - run: python tooling/vcf/content_identity.py validate

  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=foundation/automation/terraform fmt -check
